<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso | Planificador de Tareas</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts & Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined">

    <!-- CSS -->
    <link rel="stylesheet" href="../../css/style.css">
    <link rel="stylesheet" href="./login.css">
</head>

<body>

    <!-- CONTENEDOR PANTALLA COMPLETA SIN BORDES NI MÁRGENES -->
    <main class="auth-fullscreen">
        <div class="auth-row" id="authRow">

            <!-- MITAD 1: FORMULARIO (50% DEL ANCHO DE PANTALLA) -->
            <section class="form-column">
                <div class="auth-card-content">

                    <!-- ENCABEZADO Y LOGO -->
                    <div class="text-center mb-4">
                        <img src="../../assets/images/img1.svg" alt="Logo" width="56" height="56" class="mb-2">
                        <h3 class="fw-bold text-dark m-0">Planificador de Tareas</h3>
                        <p class="text-secondary small mt-1" id="authSubtitle">Ingresa a tu cuenta para gestionar tus tareas</p>
                    </div>

                    <form id="loginForm" class="auth-form d-flex flex-column gap-3">
    <div>
        <label for="loginEmail" class="form-label fw-medium mb-1">Correo Electrónico</label>
        <div class="input-group">
            <span class="input-group-text bg-white"><span class="material-symbols-outlined">mail</span></span>
            <input type="email" class="form-control" id="loginEmail" placeholder="correo@ejemplo.com" required>
        </div>
    </div>

    <div>
        <label for="loginPassword" class="form-label fw-medium mb-1">Contraseña</label>
        <div class="input-group">
            <span class="input-group-text bg-white"><span class="material-symbols-outlined">lock</span></span>
            <input type="password" class="form-control" id="loginPassword" placeholder="••••••••" required>
        </div>
    </div>

    <div class="d-grid mt-2">
        <button type="submit" class="btn btn-primary rounded-pill py-2-5 fw-semibold fs-6">
            Iniciar Sesión
        </button>
    </div>

    <div class="text-center">
        <span class="text-secondary">¿No tienes una cuenta?</span>
        <button type="button" id="btnGoToRegister" class="btn btn-link p-0 ms-1 text-decoration-none fw-semibold">
            Crear cuenta
        </button>
    </div>
</form>

<!-- ================= FORMULARIO CREAR CUENTA ================= -->
<form id="registerForm" class="auth-form d-flex flex-column gap-3 d-none">
    <div>
        <label for="regName" class="form-label fw-medium mb-1">Nombre Completo</label>
        <div class="input-group">
            <span class="input-group-text bg-white"><span class="material-symbols-outlined">person</span></span>
            <input type="text" class="form-control" id="regName" placeholder="Tu nombre completo" required>
        </div>
    </div>

    <div>
        <label for="regEmail" class="form-label fw-medium mb-1">Correo Electrónico</label>
        <div class="input-group">
            <span class="input-group-text bg-white"><span class="material-symbols-outlined">mail</span></span>
            <input type="email" class="form-control" id="regEmail" placeholder="correo@ejemplo.com" required>
        </div>
    </div>

    <div>
        <label for="regPassword" class="form-label fw-medium mb-1">Contraseña</label>
        <div class="input-group">
            <span class="input-group-text bg-white"><span class="material-symbols-outlined">lock</span></span>
            <input type="password" class="form-control" id="regPassword" placeholder="••••••••" required>
        </div>
    </div>

    <div class="d-grid mt-2">
        <button type="submit" class="btn btn-primary rounded-pill py-2-5 fw-semibold fs-6">
            Registrarse
        </button>
    </div>

    <div class="text-center">
        <span class="text-secondary">¿Ya tienes cuenta?</span>
        <button type="button" id="btnGoToLogin" class="btn btn-link p-0 ms-1 text-decoration-none fw-semibold">
            Iniciar sesión
        </button>
    </div>
</form>

                    <!-- DIVISOR -->
                    <div class="d-flex align-items-center my-3">
                        <hr class="flex-grow-1 m-0">
                        <span class="px-3 text-secondary small">o continúa con</span>
                        <hr class="flex-grow-1 m-0">
                    </div>

                    <!-- BOTONES SOCIALES -->
                    <div class="d-flex flex-column gap-2">
                        <button type="button" class="btn btn-outline-secondary rounded-pill py-2 d-flex align-items-center justify-content-center gap-2 fw-medium social-btn" id="btnGoogleAuth">
                            <svg width="18" height="18" viewBox="0 0 24 24">
                                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                            </svg>
                            <span>Continuar con Google</span>
                        </button>

                        <button type="button" class="btn btn-outline-secondary rounded-pill py-2 d-flex align-items-center justify-content-center gap-2 fw-medium social-btn" id="btnMicrosoftAuth">
                            <svg width="18" height="18" viewBox="0 0 23 23">
                                <path fill="#f35325" d="M1 1h10v10H1z"/>
                                <path fill="#81bc06" d="M12 1h10v10H12z"/>
                                <path fill="#05a6f0" d="M1 12h10v10H1z"/>
                                <path fill="#ffba08" d="M12 12h10v10H12z"/>
                            </svg>
                            <span>Continuar con Microsoft</span>
                        </button>
                    </div>

                </div>
            </section>

            <!-- MITAD 2: IMAGEN A PANTALLA COMPLETA (50% DEL ANCHO DE PANTALLA) -->
            <section class="image-column">
                <div id="loginImageContainer" class="h-100 w-100">
                    <img src="../../assets/iniciosesion.png" alt="Ilustración Iniciar Sesión" class="auth-img">
                </div>
                <div id="registerImageContainer" class="h-100 w-100 d-none">
                    <img src="../../assets/crearcuenta.png" alt="Ilustración Crear Cuenta" class="auth-img">
                </div>
            </section>

        </div>
    </main>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./login.js"></script>
</body>

</html>
